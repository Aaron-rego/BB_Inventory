<title>Beirut Bites Inventory (Demo)</title>
<style>
:root{color-scheme:light;--bg:#fef2e6;--card:#fffaf4;--tx:#1a1210;--mu:#7d6a5c;--ac:#900d15;--ok:#485f11;--am:#c46f05;--bd:#ead9c6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:80px}
header{background:var(--ac);color:#fef2e6;border-bottom:4px solid var(--am);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0;display:flex;align-items:center;gap:10px}h1 img{width:34px;height:34px;border-radius:8px}#st{font-size:12px;opacity:.95;text-align:right;cursor:pointer;padding:6px;margin:-6px;-webkit-tap-highlight-color:transparent}#st u{text-decoration-style:dotted}
main{padding:12px;max-width:600px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}.nm{font-weight:600}.sub{font-size:13px;color:var(--mu)}
.low{color:var(--am);font-weight:700}.bought{background:var(--ok)!important}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer}button.p{background:var(--ac);color:#fef2e6;border:0}
.row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.row input{flex:1;min-width:90px}
.chk{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--ok);border-radius:6px;background:#fff;padding:0;flex:none;position:relative}.chk:checked{background:var(--ok)}.chk:checked::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid #fef2e6;border-width:0 3px 3px 0;transform:rotate(45deg)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;color:var(--mu)}nav button.on{color:var(--ac);font-weight:700}
.q{width:80px}.done{opacity:.5;text-decoration:line-through}h2{font-size:15px;color:var(--mu);margin:14px 0 6px}
</style></head><body>

<div style="background:#c46f05;color:#fff;text-align:center;font-size:12px;padding:5px">Sample data only · changes are not saved · refresh to start over</div>
<main id="m"></main>
<nav><button data-t="ing">Ingredients</button><button data-t="need">Needed <span id="nc"></span></button><button data-t="stock">Stock</button></nav>
<script>
const API_URL=''; // demo: no backend, nothing is saved
const UNITS=['kg','g','L','ml','pcs','pack'];
const L=k=>null;
const S=()=>{};
function seed(){return [['Shawarma chicken','kg',3,5,1],['Garlic','kg',1,2,1],['Pita bread','pack',12,5,0],['Tahini','kg',4,2,0],['Lemons','kg',6,3,0],['Cabbage','kg',2,3,0],['Cooking oil','L',8,5,0],['Cumin','g',500,200,0],['Paprika','g',150,200,0],['Soy sauce','L',3,1,0],['Foil wrap','pack',0,1,0],['Eggs','pcs',120,15,0]].map((r,k)=>({id:'d'+k,name:r[0],unit:r[1],stock:r[2],min:r[3],needed:!!r[4]}))}
let items=seed(),queue=L('queue')||[],tab='ing',ed=null,lastErr='',syncing=false,lastSync=L('last')||'never';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n*100)/100;
const isLow=i=>!!(i&&i.min>0&&i.stock<=i.min);
function flag(id){const o={type:'upd',id,f:{needed:true},opid:uid()};queue.push(o);applyLocal(o)}
function op(o){o.opid=uid();const was=isLow(items.find(x=>x.id===o.id));queue.push(o);applyLocal(o);
 if(o.type==='use'||o.type==='add'||o.type==='upd'){const i=items.find(x=>x.id===o.id);if(i&&!was&&isLow(i)&&!i.needed)flag(i.id)}
 S('items',items);S('queue',queue);render();sync()}
function addLow(){const t=items.filter(i=>isLow(i)&&!i.needed);if(!t.length)return;t.forEach(i=>flag(i.id));S('items',items);S('queue',queue);render();sync()}
const lowBtn=()=>{const n=items.filter(i=>isLow(i)&&!i.needed).length;return n?`<button class="p" style="width:100%;margin-bottom:10px" onclick="addLow()">+ Add all low items (${n})</button>`:''}
function applyLocal(o){
 if(o.type==='add'){items.push({id:o.id,name:o.name,unit:o.unit,stock:0,min:o.min||0,needed:false});return}
 const i=items.find(x=>x.id===o.id);if(!i)return;
 if(o.type==='del')items=items.filter(x=>x.id!==o.id);
 else if(o.type==='upd')Object.assign(i,o.f);
 else if(o.type==='buy'){i.stock=fmt(i.stock+o.qty);i.needed=false}
 else if(o.type==='use')i.stock=Math.max(0,fmt(i.stock-o.qty));
}
async function sync(){
 if(syncing||!API_URL.startsWith('http'))return render();
 syncing=true;render();
 try{
  while(queue.length){
   const batch=queue.slice(0,20);
   const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({ops:batch})});
   const d=await r.json();if(!d.done)throw new Error(d.error||'Unexpected reply from server');const ids=new Set(d.done);
   queue=queue.filter(o=>!ids.has(o.opid));S('queue',queue);
   if(!queue.length){items=d.items}
  }
  if(!queue.length){const r=await fetch(API_URL);items=(await r.json()).items}
  lastSync=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});S('last',lastSync);S('items',items);lastErr='';
 }catch(e){lastErr=navigator.onLine?((e&&e.message)||'Server did not respond'):'No internet connection'}
 syncing=false;render();
}
function render(){
 document.getElementById('st').innerHTML='<b>DEMO MODE</b><br><u>Tap to reset</u>';
 const nn=items.filter(i=>i.needed).length;document.getElementById('nc').textContent=nn?'('+nn+')':'';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 const m=document.getElementById('m');if(ed&&m.contains(document.activeElement))return;
 if(tab==='ing')m.innerHTML=`<div class="row"><input id="an" placeholder="New ingredient (e.g. Chicken thighs)"><select id="au">${UNITS.map(u=>`<option>${u}</option>`).join('')}</select><input id="am" type="number" inputmode="decimal" placeholder="Low at" style="max-width:90px"><button class="p" onclick="addI()">Add</button></div>`+
  (items.length?items.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<div class="card"><input type="checkbox" class="chk" ${i.needed?'checked':''} onchange="op({type:'upd',id:'${i.id}',f:{needed:this.checked}})"><div class="grow"><div class="nm">${esc(i.name)}</div><div class="sub ${i.stock<=i.min&&i.min>0?'low':''}">${i.stock} ${esc(i.unit)} in stock${i.min?' · low at '+i.min:''}</div></div><button onclick="del('${i.id}')">✕</button></div>`).join(''):'<p class="sub">No ingredients yet. Add your first above. Tick the box to mark it as needed for the next market trip.</p>');
 else if(tab==='need'){
  const n=items.filter(i=>i.needed);
  m.innerHTML=lowBtn()+(n.length?n.map(i=>`<div class="card"><div class="grow"><div class="nm">${esc(i.name)}</div><div class="sub">${i.stock} ${esc(i.unit)} in stock</div></div><input class="q" id="q${i.id}" type="number" inputmode="decimal" placeholder="${esc(i.unit)}"><button class="p bought" onclick="buy('${i.id}')">✓ Bought</button></div>`).join('')+'<p class="sub">Enter the amount purchased, then tap Bought. It updates your stock and removes the item from this list.</p>':'<p class="sub">Nothing needed. Tick items on the Ingredients tab to build your market list.</p>');
 }else{
  const lo=items.filter(i=>i.min>0&&i.stock<=i.min),ok=items.filter(i=>!lo.includes(i));
  const row=i=>ed===i.id?editRow(i):`<div class="card"><div class="grow"><div class="nm">${esc(i.name)}</div><div class="sub ${lo.includes(i)?'low':''}">${i.stock} ${esc(i.unit)}${i.min?' · low at '+i.min:''}</div></div><input class="q" id="u${i.id}" type="number" inputmode="decimal" placeholder="used"><button onclick="use('${i.id}')">Use</button><button onclick="ed='${i.id}';render()" aria-label="Edit stock">✎</button></div>`;
  m.innerHTML=(lo.length?'<h2>⚠ Running low</h2>'+lowBtn()+lo.map(row).join(''):'')+'<h2>All stock</h2>'+(ok.map(row).join('')||'<p class="sub">No other items.</p>');
 }
}
function editRow(i){return `<div class="card" style="flex-wrap:wrap"><div class="nm" style="flex-basis:100%">${esc(i.name)}</div><label class="sub">In stock (${esc(i.unit)})<br><input id="es" class="q" type="number" inputmode="decimal" value="${i.stock}"></label><label class="sub">Low at<br><input id="el" class="q" type="number" inputmode="decimal" value="${i.min||0}"></label><span class="grow"></span><button class="p" onclick="saveE('${i.id}')">Save</button><button onclick="ed=null;render()">Cancel</button></div>`}
function saveE(id){const i=items.find(x=>x.id===id);if(!i)return;const s=parseFloat(document.getElementById('es').value),l=parseFloat(document.getElementById('el').value)||0;
 if(!(s>=0))return alert('Enter the stock amount (0 or more)');if(l<0)return alert("Low at can't be negative");
 const f={};if(fmt(s)!==Number(i.stock))f.stock=fmt(s);if(l!==Number(i.min||0))f.min=l;
 ed=null;if(Object.keys(f).length)op({type:'upd',id,f});else render()}
function addI(){const n=an.value.trim();if(!n)return;op({type:'add',id:uid(),name:n,unit:au.value,min:parseFloat(am.value)||0})}
function del(id){const i=items.find(x=>x.id===id);if(i&&confirm('Delete '+i.name+'?'))op({type:'del',id})}
function buy(id){const q=parseFloat(document.getElementById('q'+id).value);if(!(q>0))return alert('Enter the quantity bought');op({type:'buy',id,qty:q})}
function use(id){const q=parseFloat(document.getElementById('u'+id).value);if(!(q>0))return alert('Enter the quantity used');op({type:'use',id,qty:q})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;ed=null;render()});
addEventListener('online',sync);addEventListener('offline',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
function desc(o){const i=items.find(x=>x.id===o.id),n=i?i.name:(o.name||'item');
 if(o.type==='add')return 'Add '+n+' ('+o.unit+(o.min?', low at '+o.min:'')+')';
 if(o.type==='del')return 'Delete '+n;
 if(o.type==='buy')return 'Bought '+o.qty+(i?' '+i.unit:'')+' of '+n;
 if(o.type==='use')return 'Used '+o.qty+(i?' '+i.unit:'')+' of '+n;
 const f=o.f||{},p=[];if('needed' in f)p.push(f.needed?'mark as needed':'remove from needed');if('stock' in f)p.push('set stock to '+f.stock);if('min' in f)p.push('set low at '+f.min);
 return n+': '+(p.join(', ')||'update')}
function fillPending(){const b=document.getElementById('ppb');if(!b)return;
 b.innerHTML=(queue.length?'<ul style="margin:0 0 10px;padding-left:18px">'+queue.map(o=>'<li style="margin:4px 0">'+esc(desc(o))+'</li>').join('')+'</ul>':'<p class="sub">Everything is synced.</p>')+(lastErr&&queue.length?'<p class="low">Last sync problem: '+esc(lastErr)+'</p>':'')+'<div class="row"><button class="p" onclick="sync()">Sync now</button><button onclick="closePending()">Close</button></div>'}
function showPending(){if(document.getElementById('pp'))return;const d=document.createElement('div');d.id='pp';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center';d.onclick=e=>{if(e.target===d)closePending()};d.innerHTML='<div style="background:var(--card);width:100%;max-width:600px;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:70vh;overflow:auto"><h2 style="margin:0 0 8px;color:var(--tx)">Pending changes</h2><div id="ppb"></div></div>';document.body.appendChild(d);fillPending()}
function closePending(){const d=document.getElementById('pp');if(d)d.remove()}
document.getElementById('st').onclick=()=>{if(confirm('Reset the demo data?')){items=seed();queue=[];ed=null;render()}};
render();sync();
</script></body></html>
